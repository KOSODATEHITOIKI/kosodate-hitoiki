name: Deploy Web (prod)

# 何をする？
#   本番のSupabaseに向けた、Web版(app.kosodate-hitoiki.com)を、Cloudflare Pagesへ公開する。
#   開発用の確認(deploy-web-dev.yml)で、CSP・ログイン・ボット対策が通ってから使う(運営の決定)。
#
# 秘密の扱い
#   Cloudflareの鍵は、GitHubの「Environment: web-prod」のSecretsに、運営が入れる(値は、ここには書かない)。
#     - Secret   CLOUDFLARE_API_TOKEN   (Pagesの配備だけの権限)
#     - Secret   CLOUDFLARE_ACCOUNT_ID
#     - Variable CLOUDFLARE_PAGES_PROJECT (Pagesのプロジェクト名)
#   Environment「web-prod」には、運営の承認(Required reviewers)を付ける。
#
# 実行
#   手動(workflow_dispatch)だけ。リリース済みの状態(main)からだけ出せる。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy (prod)
    runs-on: ubuntu-latest
    environment: web-prod
    # 本番は、main(リリース済み)からだけ出す。
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # CanvasKitを同梱する(CSPで、外部のCDNを許可しないため)。
      # 本番のSupabaseと、本番用のTurnstile Site Keyは、lib/main_prod.dart(環境: prod)が決める。
      - name: Build web (prod)
        run: flutter build web -t lib/main_prod.dart --release --no-web-resources-cdn

      # 本番のSupabaseだけを許可する安全のヘッダー。取り違えると、ここで止まる。
      - name: Make _headers (prod)
        run: scripts/web/make_headers.sh prod

      - name: Check deploy settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          # 値は出さない。空のものがあれば、名前だけを知らせて止める。
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name が、Environment「web-prod」に設定されていません"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
