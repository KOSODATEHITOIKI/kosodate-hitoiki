<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:R;src:url(FONTDIR/MPLUSRounded1c-Regular.ttf);font-weight:400}
@font-face{font-family:R;src:url(FONTDIR/MPLUSRounded1c-Medium.ttf);font-weight:500}
@font-face{font-family:R;src:url(FONTDIR/MPLUSRounded1c-Bold.ttf);font-weight:700}
html,body{margin:0;width:1206px;height:2622px;overflow:hidden;background:#FFFBF2;font-family:R;color:#6B4A3B}
.b1{position:absolute;left:-420px;top:1900px;width:1500px;height:1300px;border-radius:50%;background:{BLOB}}
.b2{position:absolute;left:880px;top:1150px;width:1100px;height:1700px;border-radius:50%;background:{BLOB}}
.cap{position:absolute;top:66px;width:100%;text-align:center;font-weight:700;font-size:32px;letter-spacing:.42em;text-indent:.42em}
.h{position:absolute;top:140px;width:100%;text-align:center;font-weight:700;font-size:82px;line-height:1.22;letter-spacing:.06em}
.sub{position:absolute;top:372px;width:100%;text-align:center;font-weight:400;font-size:37px;letter-spacing:.06em;color:#7A5E50}
.dev{position:absolute;left:123px;top:494px;width:924px;height:2006px;padding:18px;border-radius:194px;background:#fff;border:3px solid #EAE2D6;box-shadow:0 18px 50px rgba(120,90,60,.10)}
.dev img{display:block;width:924px;height:2006px;border-radius:0;clip-path:inset(3px round 178px)}
</style></head><body>
<div class="b2"></div><div class="b1"></div>
<div class="cap">子育ての気持ちに、ひと息</div>
<div class="h">{H1}<br>{H2}</div>
<div class="sub">{SUB}</div>
<div class="dev"><img src="{IMG}"></div>
</body></html>
